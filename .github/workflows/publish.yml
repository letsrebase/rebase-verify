name: publish

# Publishes @letsrebase/verify to npm when a v<version> tag is pushed. npm trusts
# this workflow by its file name (trusted publishing over OIDC), so there is no npm
# token anywhere and every version carries a provenance attestation. Renaming this
# file breaks publishing until the trusted publisher on npmjs.com is updated.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Check the tag names the package version and sits on main
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm publish
